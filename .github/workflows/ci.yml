name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: review_engine
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d review_engine"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5434/review_engine
      REDIS_URL: redis://localhost:6379/0
      GOOGLE_API_KEY: ci-placeholder-key
      ADMIN_API_KEY: ci-test-admin-key
      CORS_ORIGINS: http://localhost:5173
      REQUIRE_ADMIN_API_KEY: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff lint
        run: ruff check src tests config scripts --ignore E501

      - name: Run migrations
        run: alembic upgrade head

      - name: Pytest
        run: pytest -q --ignore=tests/test_settings.py

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile -t review-engine-api:ci .
      - name: Build worker image
        run: docker build -f Dockerfile.worker -t review-engine-worker:ci .
